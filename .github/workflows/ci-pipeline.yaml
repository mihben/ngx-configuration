name: CI Pipeline
run-name: "PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  checks: write
  pull-requests: write

defaults:
  run:
    working-directory: src

jobs:
  build:
    uses: mihben/actions-repository/.github/workflows/angular_ci-pipeline@feature/angular-actions
    with:
      project: '["ngx-configuration"]'
    secrets: inherit

