name: CI Pipeline
run-name: 'PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}'

on:
    pull_request:
        branches:
            - main
            - develop
            - 'release/**'

permissions:
    checks: write
    pull-requests: write

defaults:
    run:
        working-directory: src

env:
    TEST_RESULT_DIR: test-results

jobs:
    install-dependencies:
        runs-on: ubuntu-latest
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Calculate Cache Key
              id: cache-key
              run: echo "CACHE_KEY=${{ runner.os }}-node-modules-${{ hashFiles('src/package-lock.json') }}" >> "$GITHUB_OUTPUT"

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node_modules_cache
              with:
                  key: ${{ steps.cache-key.outputs.CACHE_KEY }}
                  path: src/node_modules

            - name: Restore Dependencies
              if: steps.node_modules_cache.outputs.cache-hit != 'true'
              run: npm ci

    build-core:
        needs: [install-dependencies]
        runs-on: ubuntu-latest

        steps:
            - name: Build
              uses: ./.github/actions/ng-lib-build
              with:
                cache-enabled: true
                cache-id: cache
                cache-key: ${{ needs.install-dependencies.outputs.deps-cache-key }}

                project: ngx-configuration-core

    build-options:
        needs: [install-dependencies]
        runs-on: ubuntu-latest

        steps:
          - name: Build
            uses: ./.github/actions/ng-lib-build
            with:
              cache-enabled: true
              cache-id: cache
              cache-key: ${{ needs.install-dependencies.outputs.deps-cache-key }}

              project: ngx-configuration-options

    test:
        needs: [build-core]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Test
              env:
                  JEST_JUNIT_OUTPUT_FILE: ${{ env.TEST_RESULT_DIR }}/tests.unit.xml
                  JEST_JUNIT_REPORT_TEST_SUITE_ERRORS: true
              run: |
                  npm install jest-junit --save-devs
                  npm run test:ci
              continue-on-error: true

            - name: Install TestSpace CLI
              uses: testspace-com/setup-testspace@v1
              with:
                  domain: ${{ github.repository_owner }}

            - name: Publish Test Results
              run: testspace ${{ env.TEST_RESULT_DIR }}/tests.unit.xml coverage/clover.xml

