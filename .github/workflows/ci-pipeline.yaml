name: CI Pipeline
run-name: "PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  checks: write
  pull-requests: write

defaults:
  run:
    working-directory: src

env:
  TEST_RESULT_DIR: test-results

jobs:
  restore-dependencies:
    runs-on: ubuntu-latest
    outputs:
      deps-cache-key: ${{ steps.cache.outputs.cache_key }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Depedencies
        uses: mihben/actions-repository/actions/node/restore-dependencies@feature/angular-actions
        id: cache
        with:
          working-directory: src
          cache_enabled: true
          package-lock: package-lock.json

  build:
    needs: [restore-dependencies]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/ng-lib-build
        with:
          cache-enabled: true
          cache-key: ${{ needs.restore-dependencies.outputs.deps-cache-key }}

          project: ngx-configuration

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ env.TEST_RESULT_DIR }}/tests.unit.xml
          JEST_JUNIT_REPORT_TEST_SUITE_ERRORS: true
        run: |
          npm install jest-junit --save-devs
          npm run test:ci
        continue-on-error: true

      - name: Install TestSpace CLI
        uses: testspace-com/setup-testspace@v1
        with:
          domain: ${{ github.repository_owner }}

      - name: Publish Test Results
        run: testspace ${{ env.TEST_RESULT_DIR }}/tests.unit.xml coverage/clover.xml

