name: CI Pipeline
run-name: 'PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}'

on:
    pull_request:
        branches:
            - main
            - develop
            - 'release/**'

permissions:
    checks: write
    pull-requests: write

env:
    TEST_RESULT_DIR: test-results

jobs:
    ng-lib:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: src

        strategy:
            matrix:
                node-version: ['20.x']

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Build
              run: |
                  npm ci 
                  npm run buil --if-present

            - name: Test
              env:
                  JEST_JUNIT_OUTPUT_FILE: ${{ env.TEST_RESULT_DIR }}/tests.unit.xml
                  JEST_JUNIT_REPORT_TEST_SUITE_ERRORS: true
              run: |
                  npm install jest-junit --save-devs
                  npm run test:ci

            - name: Install TestSpace CLI
              uses: testspace-com/setup-testspace@v1
              with:
                  domain: ${{github.repository_owner}}

            - name: Publish Test Results
              run: testspace src/${{ env.TEST_RESULT_DIR }}/*.xml
